# Share this folder. On the other PC:
#   docker compose up --build
# Then open http://localhost:8501
# Login admin / admin123   or   agent / agent123

services:
  mysql:
    image: mysql:8.0
    container_name: anp-port-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: anp_port_dev
      MYSQL_DATABASE: anp_port_new_db
      MYSQL_ROOT_HOST: "%"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-panp_port_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3308:3306"

  app:
    build: .
    container_name: anp-port-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: anp_port_dev
      MYSQL_DATABASE: anp_port_new_db
    ports:
      - "8501:8501"

volumes:
  mysql_data:
